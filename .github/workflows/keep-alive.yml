name: Keep Render Backend Alive

on:
  schedule:
    - cron: "*/5 * * * *"   # every 10 minutes
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend root
        run: |
          curl -s https://findroom-backend.onrender.com/ > /dev/null
